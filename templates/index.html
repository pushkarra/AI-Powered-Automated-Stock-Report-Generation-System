<!DOCTYPE html>
<html>
<head>
    <title>AI Stock Report System</title>

    <style>
        body{
            font-family: Arial;
            background-color:#f4f4f4;
            padding:40px;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:70%;
            margin:auto;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:#333;
        }

        form{
            text-align:center;
            margin-bottom:30px;
        }

        input{
            padding:10px;
            width:250px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table, th, td{
            border:1px solid #ccc;
        }

        th, td{
            padding:10px;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI-Powered Automated Stock Report Generation System</h1>

    <form method="POST">

        <input type="text" name="stock" placeholder="Enter Stock Symbol (Example: TCS.NS)" required>

        <button type="submit">Generate Report</button>

    </form>

    {% if tables %}
        {{ tables|safe }}
    {% endif %}

    {% if graph_generated %}

      <h2 style="margin-top:40px; text-align:center;">
         Stock Price Trend Graph
      </h2>

      <div style="text-align:center; margin-top:20px;">

         <img src="{{ url_for('static', filename='stock_graph.png') }}"
             width="800">

      </div>

    {% endif %}

</div>

</body>
</html>
